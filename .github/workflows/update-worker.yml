name: Auto Update Worker

on:
  # 手动修改仓库时触发
  push:
    branches:
      - main

  # 每周一 UTC 01:00 自动检查
  schedule:
    - cron: "0 1 * * 1"

  # 支持 GitHub Actions 页面手动运行
  workflow_dispatch:

# 防止多个更新任务同时运行
concurrency:
  group: bpb-worker-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. 初始化仓库
      # ==========================================================
      - name: 初始化仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. 获取当前本地版本
      # ==========================================================
      - name: 获取当前本地版本
        id: local_version
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[获取本地版本]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          if [ -f version.txt ]; then
            LOCAL_VERSION=$(tr -d '[:space:]' < version.txt)

            echo "当前本地版本: ${LOCAL_VERSION:-无}"

            if [ -z "$LOCAL_VERSION" ]; then
              echo "version.txt 存在，但版本号为空。"
            fi
          else
            echo "没有找到 version.txt，视为首次同步。"
            LOCAL_VERSION=""
          fi

          echo "LOCAL_VERSION=$LOCAL_VERSION" >> "$GITHUB_ENV"

      # ==========================================================
      # 3. 获取 GitHub 最新 Release
      # ==========================================================
      - name: 获取最新 Release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[获取最新 BPB Release]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"

          echo "正在请求 GitHub API..."

          # ------------------------------------------------------
          # GitHub API 最多重试 5 次
          # ------------------------------------------------------
          for i in 1 2 3 4 5; do

            echo "API 请求，第 $i/5 次..."

            if RESPONSE=$(curl -fsSL \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL"); then

              echo "GitHub API 请求成功。"
              break

            else

              if [ "$i" -eq 5 ]; then
                echo -e "\033[31mGitHub API 连续 5 次请求失败！\033[0m"
                exit 1
              fi

              echo "请求失败，10 秒后重试..."
              sleep 10

            fi

          done

          # ------------------------------------------------------
          # 获取版本号
          # ------------------------------------------------------
          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name')

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo -e "\033[31m无法从 GitHub Release 获取版本号！\033[0m"
            exit 1
          fi

          # ------------------------------------------------------
          # 获取 worker.js Asset
          # ------------------------------------------------------
          ASSET=$(echo "$RESPONSE" |
            jq -c '.assets[] | select(.name == "worker.js")' |
            head -n 1)

          if [ -z "$ASSET" ]; then
            echo -e "\033[31m最新 Release 中没有找到 worker.js！\033[0m"
            echo "Release: $TAG_NAME"
            exit 1
          fi

          DOWNLOAD_URL=$(echo "$ASSET" | jq -r '.browser_download_url')

          # GitHub Release API 新版会提供：
          #
          # digest: "sha256:xxxxxxxx..."
          #
          # 直接读取官方提供的 SHA256。
          OFFICIAL_DIGEST=$(echo "$ASSET" | jq -r '.digest // empty')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo -e "\033[31m无法获取 worker.js 下载地址！\033[0m"
            exit 1
          fi

          # ------------------------------------------------------
          # 提取 SHA256
          # ------------------------------------------------------
          if [[ "$OFFICIAL_DIGEST" == sha256:* ]]; then
            OFFICIAL_SHA256="${OFFICIAL_DIGEST#sha256:}"
          else
            OFFICIAL_SHA256=""
          fi

          echo ""
          echo "最新版本: $TAG_NAME"
          echo "文件名称: worker.js"
          echo "下载地址: $DOWNLOAD_URL"

          if [ -n "$OFFICIAL_SHA256" ]; then
            echo "官方 SHA256: $OFFICIAL_SHA256"
          else
            echo -e "\033[33mGitHub Release 未提供 SHA256 digest。\033[0m"
            echo "将执行下载文件 SHA256 计算，但无法进行官方摘要比对。"
          fi

          # ------------------------------------------------------
          # 写入 GitHub Environment
          # ------------------------------------------------------
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "OFFICIAL_SHA256=$OFFICIAL_SHA256" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. 判断是否需要更新
      # ==========================================================
      - name: 判断是否需要更新
        id: check_update
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[版本检测]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          echo "本地版本: ${LOCAL_VERSION:-无}"
          echo "最新版本: $TAG_NAME"

          if [ -n "$LOCAL_VERSION" ] && [ "$LOCAL_VERSION" = "$TAG_NAME" ]; then

            echo ""
            echo -e "\033[32m当前已经是最新版本，无需更新。\033[0m"

            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"

          else

            echo ""
            echo -e "\033[33m发现新版本，需要更新！\033[0m"

            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"

          fi

      # ==========================================================
      # 5. 下载新的 worker.js
      # ==========================================================
      - name: 下载最新 Worker
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[下载最新 worker.js]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          # ------------------------------------------------------
          # 使用临时文件
          #
          # 非常重要：
          # 不直接覆盖旧 worker.js。
          #
          # 只有下载成功 + SHA256 校验成功后，
          # 才会替换旧文件。
          # ------------------------------------------------------

          TEMP_FILE="worker.js.tmp"

          rm -f "$TEMP_FILE"

          echo "下载地址:"
          echo "$DOWNLOAD_URL"
          echo ""

          # ------------------------------------------------------
          # 下载最多重试 5 次
          # ------------------------------------------------------
          DOWNLOAD_SUCCESS=false

          for i in 1 2 3 4 5; do

            echo "下载，第 $i/5 次..."

            rm -f "$TEMP_FILE"

            if curl -fL \
              --connect-timeout 15 \
              --max-time 180 \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              "$DOWNLOAD_URL" \
              -o "$TEMP_FILE"; then

              DOWNLOAD_SUCCESS=true
              echo "下载成功。"
              break

            else

              echo -e "\033[33m下载失败。\033[0m"

              if [ "$i" -lt 5 ]; then
                echo "10 秒后重新下载..."
                sleep 10
              fi

            fi

          done

          if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
            echo -e "\033[31m连续 5 次下载失败！\033[0m"
            rm -f "$TEMP_FILE"
            exit 1
          fi

          # ------------------------------------------------------
          # 检查文件是否为空
          # ------------------------------------------------------
          if [ ! -s "$TEMP_FILE" ]; then
            echo -e "\033[31m下载的 worker.js 为空！\033[0m"
            rm -f "$TEMP_FILE"
            exit 1
          fi

          echo ""
          echo "下载文件信息："
          ls -lh "$TEMP_FILE"

      # ==========================================================
      # 6. SHA256 校验
      # ==========================================================
      - name: SHA256 完整性校验
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[SHA256 完整性校验]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          TEMP_FILE="worker.js.tmp"

          # ------------------------------------------------------
          # 计算实际 SHA256
          # ------------------------------------------------------
          ACTUAL_SHA256=$(sha256sum "$TEMP_FILE" | awk '{print $1}')

          echo "实际 SHA256:"
          echo "$ACTUAL_SHA256"

          # ------------------------------------------------------
          # 如果 GitHub Release 提供官方 digest
          # 则进行严格比对
          # ------------------------------------------------------
          if [ -n "$OFFICIAL_SHA256" ]; then

            echo ""
            echo "GitHub 官方 SHA256:"
            echo "$OFFICIAL_SHA256"

            if [ "$ACTUAL_SHA256" != "$OFFICIAL_SHA256" ]; then

              echo ""
              echo -e "\033[31m========================================\033[0m"
              echo -e "\033[31mSHA256 校验失败！\033[0m"
              echo -e "\033[31m========================================\033[0m"

              echo "实际值:"
              echo "$ACTUAL_SHA256"

              echo "官方值:"
              echo "$OFFICIAL_SHA256"

              echo ""
              echo "为了安全起见，不会覆盖现有 worker.js。"

              rm -f "$TEMP_FILE"

              exit 1
            fi

            echo ""
            echo -e "\033[32mSHA256 校验成功！\033[0m"

          else

            # ----------------------------------------------------
            # 如果 GitHub API 没提供 digest
            #
            # 仍然计算 SHA256，作为日志记录。
            # 但不能宣称已经完成“官方 SHA256 比对”。
            # ----------------------------------------------------

            echo ""
            echo -e "\033[33mGitHub Release 没有提供官方 SHA256 digest。\033[0m"
            echo -e "\033[33m已完成本地 SHA256 计算，但无法进行官方值比对。\033[0m"

          fi

          # 保存 SHA256 到环境变量，供后面日志使用
          echo "ACTUAL_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. 替换 Worker
      # ==========================================================
      - name: 更新 Worker 文件
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[更新 Worker]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          # ------------------------------------------------------
          # SHA256 已经通过后才允许替换
          # ------------------------------------------------------
          mv worker.js.tmp worker.js

          # 更新版本号
          echo "$TAG_NAME" > version.txt

          echo ""
          echo "Worker 已更新："
          ls -lh worker.js

          echo ""
          echo "版本号："
          cat version.txt

          echo ""
          echo "SHA256："
          sha256sum worker.js

      # ==========================================================
      # 8. 最终检查 Git 修改
      # ==========================================================
      - name: 检查文件变更
        if: env.UPDATE_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[检查文件变更]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          git status --short

          # ------------------------------------------------------
          # 如果实际上没有任何变化
          # 则不提交
          # ------------------------------------------------------
          if git diff --quiet -- worker.js version.txt; then

            echo ""
            echo -e "\033[32mworker.js 和 version.txt 没有实际变化。\033[0m"
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"

          else

            echo ""
            echo "检测到文件变化。"
            echo "NO_CHANGES=false" >> "$GITHUB_ENV"

          fi

      # ==========================================================
      # 9. 提交并 Push
      # ==========================================================
      - name: 提交更新
        if: env.UPDATE_NEEDED == 'true' && env.NO_CHANGES != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🔄 自动同步 BPB Worker ${{ env.TAG_NAME }} [skip ci]"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # ==========================================================
      # 10. 输出最终结果
      # ==========================================================
      - name: 输出更新结果
        shell: bash
        run: |
          echo ""
          echo -e "\033[34m========================================\033[0m"
          echo -e "\033[34m[任务完成]\033[0m"
          echo -e "\033[34m========================================\033[0m"

          echo "本地原版本: ${LOCAL_VERSION:-无}"
          echo "当前最新版本: $TAG_NAME"

          if [ "${UPDATE_NEEDED:-false}" = "true" ]; then
            echo "执行结果: 已检查更新流程"
          else
            echo "执行结果: 已是最新版本，无需更新"
          fi

          if [ -n "${ACTUAL_SHA256:-}" ]; then
            echo "Worker SHA256: $ACTUAL_SHA256"
          fi
